# ==========================================================================
#  Configuración de Reservas
# ==========================================================================
#  Para editarla: clic derecho en el ícono de Reservas junto al reloj
#  > "Editar configuración". Al guardar, Reservas se reinicia solo
#  para aplicar los cambios.
#
#  Las líneas que empiezan con # son comentarios.
# ==========================================================================

# --- Base de datos (MySQL incluido en el programa) ------------------------
# Nombre de la base de datos dentro del MySQL del programa.
# Solo letras, números y guion bajo. El nombre "reservas_app" está reservado.
DB_DATABASE=ReservasPaquete

# --- Puertos (solo cambiar si otro programa ya los usa) --------------------
# PUERTO_MYSQL no puede ser 3306 (es el de Laragon/XAMPP).
PUERTO_SISTEMA=8093
PUERTO_MYSQL=3320

# --- Avanzado ---------------------------------------------------------------
# Cualquier otra variable del .env de Laravel puede agregarse aquí y tiene
# prioridad sobre la configuración interna. Ejemplo:
# LOG_LEVEL=debug
# La conexión a la base de datos (DB_HOST, DB_PORT, DB_USERNAME,
# DB_PASSWORD) la define siempre el programa y no se puede cambiar aquí.
