[PHP]
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
post_max_size = 256M
upload_max_filesize = 256M
display_errors = Off
log_errors = On
; Con E, $_ENV conserva las variables de Windows (SystemRoot...) para los procesos que lance PHP (Symfony Process)
variables_order = "EGPCS"
request_order = "GP"
default_charset = "UTF-8"
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; extension_dir, curl.cainfo y openssl.cafile los define Reservas.exe con rutas absolutas
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; opcache.file_cache lo define Reservas.exe en la carpeta de datos del usuario
opcache.file_cache_fallback = 1
